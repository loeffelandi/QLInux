# Baut x86_64- und aarch64-AppImage nativ. Bei einem veröffentlichten
# Release kommen beide Dateien (plus .zsync) erst hoch, wenn beide Builds
# durch sind. workflow_dispatch legt nur Artefakte ab.
name: AppImage

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: build ${{ matrix.arch }} AppImage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      # release: github.sha ist der Stand von main, nicht der Tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"

      - name: Runner image
        id: image
        run: |
          echo "name=${ImageOS:-linux}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      # Qt braucht die XCB-Helfer auch zum *Packen*: fehlen sie auf dem
      # Runner, laesst PyInstaller sie weg und das AppImage startet ohne
      # xcb-Plugin.
      - name: Qt and XCB libraries
        run: |
          sudo apt-get update
          pkgs="libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1"
          pkgs="$pkgs libxcb-cursor0 libxcb-icccm4 libxcb-image0"
          pkgs="$pkgs libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1"
          pkgs="$pkgs libxkbcommon-x11-0 libxcb-shape0 libxcb-randr0"
          pkgs="$pkgs libxcb-xinerama0 libxcb-xfixes0 libxcb-sync1"
          pkgs="$pkgs libxcb-shm0 libxcb-util1"
          if ! sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0t64
          then
            sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0
          fi

      - name: Cache virtualenv
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'scripts/patch_brother_ql.py') }}

      - name: Pip cache directory
        id: pip-dir
        if: steps.venv.outputs.cache-hit != 'true'
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip wheels
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-dir.outputs.dir }}
          key: pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-

      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python scripts/patch_brother_ql.py

      - name: Build AppImage
        run: bash packaging/build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLInux-${{ matrix.arch }}-AppImage
          path: |
            dist/QLInux-*-${{ matrix.arch }}.AppImage
            dist/QLInux-*-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

  publish:
    name: attach both AppImages
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QLInux-*-AppImage
          path: dist
          merge-multiple: true

      # gh leitet das Repo aus .git ab. Dieser Job checkt nichts aus.
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/QLInux-*-x86_64.AppImage dist/QLInux-*-x86_64.AppImage.zsync \
                 dist/QLInux-*-aarch64.AppImage dist/QLInux-*-aarch64.AppImage.zsync)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "Erwartet 4 Dateien, gefunden ${#files[@]}: ${files[*]}" >&2
            ls -la dist >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
