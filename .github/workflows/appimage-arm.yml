# Baut das aarch64-AppImage nativ auf dem ARM-Runner und hängt es an einen
# veröffentlichten Release (workflow_dispatch liefert nur Artefakte).
name: AppImage (aarch64)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: build aarch64 AppImage
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"

      - name: Runner image
        id: image
        run: |
          echo "name=${ImageOS:-linux}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      - name: Cache Qt packages
        id: qt-debs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt-offscreen-debs
          key: qt-offscreen-${{ steps.image.outputs.name }}-${{ steps.image.outputs.version }}-${{ runner.arch }}-libegl1

      - name: Qt libraries
        run: |
          dest="${{ runner.temp }}/qt-offscreen-debs"
          mkdir -p "$dest"
          if compgen -G "$dest/*.deb" > /dev/null && sudo dpkg -i "$dest"/*.deb
          then
            exit 0
          fi
          sudo apt-get update
          pkgs="libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1"
          if ! sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0t64
          then
            sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0
          fi
          rm -f "$dest"/*.deb
          cp /var/cache/apt/archives/libegl1_*.deb /var/cache/apt/archives/libegl-mesa0_*.deb "$dest"/

      - name: Cache virtualenv
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'scripts/patch_brother_ql.py') }}

      - name: Pip cache directory
        id: pip-dir
        if: steps.venv.outputs.cache-hit != 'true'
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip wheels
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-dir.outputs.dir }}
          key: pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-

      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python scripts/patch_brother_ql.py

      - name: Build AppImage
        run: bash packaging/build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLInux-aarch64-AppImage
          path: |
            dist/QLInux-*-aarch64.AppImage
            dist/QLInux-*-aarch64.AppImage.zsync
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/QLInux-*-aarch64.AppImage dist/QLInux-*-aarch64.AppImage.zsync)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
