# Dieselbe Suite wie lokal: requirements-dev, brother_ql-Patch, pytest offscreen
# (tests/conftest.py setzt QT_QPA_PLATFORM).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # PySide6 bringt Qt mit; dem offscreen-Plugin fehlen auf dem Runner
      # nur die Systembibliotheken.
      - name: Qt offscreen libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/patch_brother_ql.py

      - name: Test
        run: |
          if python -X faulthandler -m pytest -q; then
            exit 0
          fi
          # Qt bricht auf manchen Kombinationen mit SIGABRT ab, ohne Trace.
          # Den vermuteten Test unter gdb laufen lassen, damit der Frame im Log steht.
          sudo apt-get install -y --no-install-recommends gdb
          gdb -batch -ex "set pagination off" -ex run -ex bt --args \
            python -m pytest -q tests/test_gui.py::test_ruler_label_step_follows_the_zoom
          exit 1
