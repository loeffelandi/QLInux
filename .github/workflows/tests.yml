# Dieselbe Suite wie lokal: requirements-dev, brother_ql-Patch, pytest offscreen
# (tests/conftest.py setzt QT_QPA_PLATFORM).
#
# Nur 3.12: PySide6 6.12 auf Python 3.10 unter Linux bricht mitten in der Suite
# mit SIGABRT ab ("Fatal Python error: deallocating None", im GC beim
# Freigeben eines Moduls). Auf macOS mit 3.10 läuft dieselbe Suite durch.
name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # PySide6 bringt Qt mit; dem offscreen-Plugin fehlen auf dem Runner
      # nur die Systembibliotheken. libglib heisst ab Ubuntu 24.04 t64;
      # aeltere Images haben nur den alten Paketnamen.
      - name: Qt offscreen libraries
        run: |
          sudo apt-get update
          pkgs="libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1"
          if ! sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0t64
          then
            sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0
          fi

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/patch_brother_ql.py

      # Faulthandler: ein Qt-/C++-Absturz hinterlaesst den laufenden Test
      # und einen Stacktrace, statt nur „exit code 134".
      - name: Test
        run: python -X faulthandler -m pytest
