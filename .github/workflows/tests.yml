# Dieselbe Suite wie lokal: requirements-dev, brother_ql-Patch, pytest offscreen
# (tests/conftest.py setzt QT_QPA_PLATFORM).
#
# Nur 3.12: PySide6 6.12 auf Python 3.10 unter Linux bricht mitten in der Suite
# mit SIGABRT ab ("Fatal Python error: deallocating None", im GC beim
# Freigeben eines Moduls). Auf macOS mit 3.10 läuft dieselbe Suite durch.
name: Tests

permissions:
  actions: write
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Runner image
        id: image
        run: |
          echo "name=${ImageOS:-linux}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      # PySide6 bringt Qt mit; dem offscreen-Plugin fehlen auf dem Runner
      # nur die Systembibliotheken. libglib heisst ab Ubuntu 24.04 t64;
      # aeltere Images haben nur den alten Paketnamen.
      #
      # apt-get update kostet den Grossteil der ~9s: neu installiert wird
      # nur libegl1 samt libegl-mesa0 (~150 kB). Die debs liegen im Cache,
      # dpkg legt sie ohne Paketlisten auf. Schlaegt das fehl, bleibt der
      # bisherige apt-Weg.
      - name: Cache Qt offscreen packages
        id: qt-debs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt-offscreen-debs
          key: qt-offscreen-${{ steps.image.outputs.name }}-${{ steps.image.outputs.version }}-${{ runner.arch }}-libegl1

      - name: Qt offscreen libraries
        run: |
          dest="${{ runner.temp }}/qt-offscreen-debs"
          mkdir -p "$dest"
          if compgen -G "$dest/*.deb" > /dev/null && sudo dpkg -i "$dest"/*.deb
          then
            exit 0
          fi
          sudo apt-get update
          pkgs="libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1"
          if ! sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0t64
          then
            sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0
          fi
          rm -f "$dest"/*.deb
          cp /var/cache/apt/archives/libegl1_*.deb /var/cache/apt/archives/libegl-mesa0_*.deb "$dest"/

      # Der bisherige pip-Wheel-Cache trifft, das Entpacken von PySide6
      # dauert trotzdem ~9s und liegt vor pytest. Die installierte venv
      # ersetzt diesen Schritt. Die Wheels werden nur geladen, wenn die
      # venv neu gebaut wird. Testergebnisse liegen nicht im Cache.
      - name: Cache virtualenv
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'scripts/patch_brother_ql.py') }}

      - name: Pip cache directory
        id: pip-dir
        if: steps.venv.outputs.cache-hit != 'true'
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip wheels
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-dir.outputs.dir }}
          key: pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          # setup-python-Linux-… ist der bisherige Wheel-Cache. Er gilt nur
          # als Reserve, solange der eigene pip-Key noch fehlt.
          restore-keys: |
            pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-
            setup-python-${{ runner.os }}-

      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python scripts/patch_brother_ql.py

      # Faulthandler: ein Qt-/C++-Absturz hinterlaesst den laufenden Test
      # und einen Stacktrace, statt nur „exit code 134".
      - name: Test
        run: .venv/bin/python -X faulthandler -m pytest
