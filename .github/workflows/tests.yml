# Dieselbe Suite wie lokal: requirements-dev, brother_ql-Patch, pytest offscreen
# (tests/conftest.py setzt QT_QPA_PLATFORM).
#
# Nur 3.12: PySide6 6.12 auf Python 3.10 unter Linux bricht mitten in der Suite
# mit SIGABRT ab ("Fatal Python error: deallocating None", im GC beim
# Freigeben eines Moduls). Auf macOS (Apple Silicon) laeuft dieselbe Suite
# mit 3.12 durch; der Mac-Job baut zusaetzlich das .app.
name: Tests

permissions:
  actions: write
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Runner image
        id: image
        run: |
          echo "name=${ImageOS:-linux}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      # PySide6 bringt Qt mit; dem offscreen-Plugin fehlen auf dem Runner
      # nur die Systembibliotheken. libglib heisst ab Ubuntu 24.04 t64;
      # aeltere Images haben nur den alten Paketnamen.
      #
      # Kein .deb-Cache fuer libegl: die gecachten Pakete koennen zu neueren
      # mesa-Abhaengigkeiten passen als der Runner installiert hat. dpkg
      # laesst die Kette dann halb installiert zurueck, und apt kann sie
      # nicht mehr aufloesen.
      - name: Qt offscreen libraries
        run: |
          sudo apt-get update
          pkgs="libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1"
          if ! sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0t64
          then
            sudo apt-get install -y --no-install-recommends $pkgs libglib2.0-0
          fi

      # Der bisherige pip-Wheel-Cache trifft, das Entpacken von PySide6
      # dauert trotzdem ~9s und liegt vor pytest. Die installierte venv
      # ersetzt diesen Schritt (Archiv ~270 MB, gleiche Groessenordnung
      # wie der Wheel-Cache). Die Wheels werden nur geladen, wenn die
      # venv neu gebaut wird. Testergebnisse liegen nicht im Cache.
      - name: Cache virtualenv
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'scripts/patch_brother_ql.py') }}

      - name: Pip cache directory
        id: pip-dir
        if: steps.venv.outputs.cache-hit != 'true'
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip wheels
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-dir.outputs.dir }}
          key: pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          # setup-python-Linux-… ist der bisherige Wheel-Cache. Er gilt nur
          # als Reserve, solange der eigene pip-Key noch fehlt.
          restore-keys: |
            pip-${{ steps.image.outputs.name }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-
            setup-python-${{ runner.os }}-

      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python scripts/patch_brother_ql.py

      # Einmal pro Lauf reicht. Der ARM-Job prüft dieselbe Suite.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy

      # Faulthandler: ein Qt-/C++-Absturz hinterlaesst den laufenden Test
      # und einen Stacktrace, statt nur „exit code 134".
      - name: Test
        run: .venv/bin/python -X faulthandler -m pytest

  # Dieselbe Suite auf Apple Silicon (macos-latest ist arm64), ohne Lint.
  # Das .app wird gebaut, damit packaging/build_macos.sh nicht unbemerkt
  # bricht (libusb im Bundle, Start ohne Homebrew-Pfad). Die Tests rufen
  # keinen echten Mac-Dialog auf: Qt laeuft offscreen.
  test-macos:
    name: pytest (Python 3.12, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python scripts/patch_brother_ql.py

      - name: Test
        run: .venv/bin/python -X faulthandler -m pytest

      - name: Build QLInux.app
        run: |
          brew install libusb
          bash packaging/build_macos.sh
