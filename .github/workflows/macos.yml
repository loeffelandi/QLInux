# Baut QLInux.app als .dmg fuer Apple Silicon (arm64). Bei einem
# veroeffentlichten Release haengt die .dmg am Release, neben den AppImages
# aus appimage.yml. workflow_dispatch legt nur ein Artefakt ab.
name: macOS

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: build arm64 .dmg
    runs-on: macos-latest
    steps:
      # release: github.sha ist der Stand von main, nicht der Tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python scripts/patch_brother_ql.py
          brew install libusb

      - name: Build .dmg
        run: bash packaging/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: QLInux-arm64-dmg
          path: dist/QLInux-*-arm64.dmg
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/QLInux-*-arm64.dmg --clobber
