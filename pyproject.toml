[project]
name = "qlinux"
version = "0.4.0"
description = "P-touch-Editor-Klon fuer Brother QL-Drucker (QL-500–QL-1060N laut brother_ql) und Avery-Zweckform-Boegen, native Linux-App"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# brother_ql 0.9.4 ruft intern `logger.warn` auf (deprecated). Das ist
# Fremdcode und fuer uns nicht relevant - die Warnung wird unterdrueckt.
filterwarnings = [
    "ignore:The 'warn' method is deprecated:DeprecationWarning",
    "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["ql_editor", "tests", "scripts", "packaging"]

[tool.ruff.lint]
# E402 und N802 gehoeren zu den bestehenden noqa-Kommentaren: Importe nach
# dem Pfad-Setup und Qt-Methoden in CamelCase.
extend-select = ["E402", "N802"]
ignore = [
    # Exception an den Raendern (Drucker, Datei, Import) ist Absicht.
    "BLE001",
    # Skripte starten als `python scripts/...`, nicht als ausfuehrbare Datei.
    "EXE001",
]

[tool.mypy]
python_version = "3.10"
files = ["ql_editor", "tests", "scripts", "packaging"]
explicit_package_bases = true
mypy_path = "."
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# Hinweis, dass untypisierte Testfunktionen nicht geprüft werden.
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = ["brother_ql.*", "barcode.*", "qrcode.*"]
ignore_missing_imports = true
